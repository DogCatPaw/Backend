services:
  app:
    image: agigora/dogcat:dev
    container_name: dogcat-app
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "8080:8080"
    depends_on:
      - redis

  redis:
    image: redis:7
    container_name: dogcat-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${SPRING_DATA_REDIS_PASSWORD}"]
    env_file:
      - .env.dev
    volumes:
      - redis_data:/data

volumes:
  redis_data: