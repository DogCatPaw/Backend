apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-api-server1
  namespace: petdid-network
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-api-server1
  template:
    metadata:
      labels:
        app: spring-api-server1
    spec:
      imagePullSecrets:
      - name: ncr-secret
      containers:
      - name: spring-api1
        image: dogcatpaw-registry.kr.ncr.ntruss.com/dogcatpaw_api_server:test
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "dev"
        # Secrets 그대로 사용
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SPRING_DATASOURCE_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SPRING_DATASOURCE_PASSWORD
        - name: SPRING_DATA_REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SPRING_DATA_REDIS_HOST
        - name: SPRING_DATA_REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SPRING_DATA_REDIS_PORT
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SPRING_DATA_REDIS_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        volumeMounts:
        - name: config-volume
          mountPath: /config
      volumes:
      - name: config-volume
        configMap:
          name: spring-config